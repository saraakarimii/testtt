server {
    listen 80;
    server_name chromabook.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name chromabook.example.com;

    # Configure certificate paths using your ACME/Let's Encrypt installation.
    ssl_certificate     /etc/letsencrypt/live/chromabook.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/chromabook.example.com/privkey.pem;

    client_max_body_size 26m;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 1800s;
        proxy_send_timeout 1800s;
    }
}
